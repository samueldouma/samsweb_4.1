<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Content Connectome — Samuel Douma</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="hybrid.css">
  <script src="site-data.js" defer></script>
  <script src="hybrid.js" defer></script>
</head>
<body>
  <header class="hybrid-topbar">
    <div class="hybrid-left-controls">
      <button id="documentBack" class="document-back line-back-arrow" type="button" aria-label="Return to previous page"><span aria-hidden="true"></span></button>
      <a id="documentOpen" class="document-open" href="about.html" target="_blank" rel="noopener">Open full page</a>
    </div>
    <div class="hybrid-view-control" aria-label="Switch between Ball View and Connectome View">
      <div class="hybrid-view-label-row">
        <span class="view-arrow hybrid-view-arrow view-arrow-inward-left" aria-hidden="true"></span>
        <span class="hybrid-view-label">Ball View / Connectome View</span>
        <span class="view-arrow hybrid-view-arrow view-arrow-inward-right" aria-hidden="true"></span>
      </div>
      <button id="ballToggle" class="hybrid-toggle" type="button" role="switch" aria-checked="true" aria-label="Return to Ball View"><span aria-hidden="true"></span></button>
    </div>
  </header>

  <main id="hybridApp">
    <section id="documentPane" aria-label="Document viewer">
      <iframe id="documentFrame" title="About" src="about.html?embedded=1"></iframe>
    </section>

    <div id="desktopDivider" class="desktop-divider" role="separator" aria-orientation="vertical" aria-label="Resize document and connectome"></div>

    <section id="graphPane" aria-label="Content connectome">
      <div class="search-wrap">
        <label class="visually-hidden" for="searchInput">Search pages and keywords</label>
        <input id="searchInput" type="search" autocomplete="off" spellcheck="false" placeholder="SEARCH PAGES, TEXT, OR KEYWORDS">
        <button id="clearSearch" type="button" aria-label="Clear search" hidden>×</button>
        <div id="searchResults" hidden></div>
      </div>
      <div id="graphWrap"><svg id="graph" role="img" aria-label="Interactive site connectome"></svg></div>
</section>

    <div id="mobileDivider" class="mobile-divider" role="separator" aria-orientation="horizontal" aria-label="Resize document and connectome">
      <span class="mobile-divider-arrow mobile-divider-arrow-up" aria-hidden="true"></span>
      <span id="mobileDividerHint" class="mobile-divider-hint">(drag and zoom)</span>
      <span class="mobile-divider-arrow mobile-divider-arrow-down" aria-hidden="true"></span>
    </div>
  </main>
</body>
</html>
